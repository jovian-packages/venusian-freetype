name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer
          coverage: none

      - name: Build ext-freetype
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev pkg-config
          git clone --depth 1 --branch 0.11.x https://github.com/php-io-extensions/freetype.git ../ext-freetype
          cd ../ext-freetype
          phpize
          ./configure --enable-freetype
          make -j"$(nproc)"
          echo "extension=$PWD/modules/freetype.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-freetype.ini"
          php --ri freetype

      - name: Checkout venusian/topside
        run: git clone --depth 1 --branch 0.11.x https://github.com/VenusianPHP/topside.git ../topside

      - name: Resolve venusian/topside from the checkout
        run: |
          composer config repositories.topside '{"type": "path", "url": "../topside", "options": {"symlink": false}}'

      - name: Install Composer dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Execute tests
        run: php -d memory_limit=128M vendor/bin/pest
